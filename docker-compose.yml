services:
  web:
    build: .
    image: ua-welding-km:latest
    container_name: ua-welding-km
    restart: unless-stopped
    # No published ports: the shared Caddy (opusitach/infra-websites) terminates
    # TLS and reaches the container over the external `edge` network by alias.
    networks:
      edge:
        aliases:
          - welding-km-app # must match reverse_proxy in infra-websites/caddy/Caddyfile
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    external: true
