# nginx config for UA WELDING-KM static site (Next.js static export in /usr/share/nginx/html).
# Plain HTTP on :8080 (unprivileged image). TLS, apex/www redirects and certificates are handled
# by the external reverse proxy in front of the container.

server_tokens off;

# Client IPs are truncated in access logs (IPv4 /24, IPv6 /48); no cookies or analytics.
map $remote_addr $remote_addr_masked {
    ~^(?<ip4>\d+\.\d+\.\d+)\.\d+$          $ip4.0;
    ~^(?<ip6>[^:]+:[^:]+:[^:]+):          $ip6::;
    default                                 0.0.0.0;
}
log_format masked '$remote_addr_masked - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent"';

# Caching: hashed build assets and fonts are immutable; images 30 days; everything else revalidates.
map $uri $cache_control {
    ~^/_next/static/   "public, max-age=31536000, immutable";
    ~^/fonts/          "public, max-age=31536000, immutable";
    ~^/images/         "public, max-age=2592000";
    default            "public, max-age=0, must-revalidate";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    access_log /dev/stdout masked;

    # Redirects keep the original host/scheme seen by the proxy instead of :8080.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml application/xml text/xml;

    # Headers are repeated per location only where add_header is used inside it; keep them at server level.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # 'unsafe-inline' for scripts is required: Next.js static export injects inline bootstrap scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

    # Legacy URLs from the original static mockup.
    # Matched on $request_uri: the index directive internally rewrites / to /index.html.
    location = /privacy.html { return 301 /privacy/; }
    if ($request_uri ~ "^/index\.html(\?|$)") { return 301 /; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # trailingSlash export: pages live at /<page>/index.html; /privacy -> /privacy/ via directory redirect.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
